<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather dashboard</title>
    <!-- bootstrap lib -->
    <link rel="stylesheet" href="./node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    
    <!-- react  lib -->
    <script src="./node_modules/react/umd/react.development.js"></script>
    <script src="./node_modules/react-dom/umd/react-dom.development.js"></script>
    <!-- compiler -->
    <script src="./node_modules/@babel/standalone/babel.js"></script>
    
    <!-- virtual dom -->
    <script type="text/babel">
        //index component
        function WeatherIndex(){
            return(
                <div className="container-fluid row">
                    <div className = "col-2">
                        <SideBar/>
                        
                    </div>
                        <div className ="col-10">
                            <Header/>
                            <WeatherCard/>
                        </div>
                </div>
            )
        }
        function SideBar(){
            return(
                <nav className ="p-2">
                    <div className ="fs-4 fw-bold text-primary mb-3"><span className ="bi bi-cloud"></span>Weather App</div>
                    <ul className="list-group">
                        <li className="list-group-item list-group-item-primary"><span className="bi bi-columns-gap">Dashboard</span></li>
                        <li className="list-group-item list-group-item-primary"><span className="bi bi-broadcast">Radar &Maps</span></li>
                        <li className="list-group-item list-group-item-primary"><span className="bi bi-clock-history">Hourly</span></li>
                        <li className="list-group-item list-group-item-primary"><span className="bi bi-calendar-date">7-day Outlook</span></li>

                        <li className="list-group-item list-group-item-primary"><span className="bi bi-wind">Air Quality</span></li>
                    </ul>
                    <button className ="btn btn-primary w-100 mt-4">Signout</button>

                </nav>
            )
        }
        function Header(){
            return(
                <header className="p-3 d-flex align-items-center bg-light mt-2 justify-content-between">
                    <div className="w-50">
                        <div className="input-group">
                            <input type="text" placeholder="Search your city weather" className="form-control"/>
                            <button className="btn btn-primary bi bi-search"></button>

                            
                            </div></div>

                            <div className ="fs-5">
                                <span className="bi bi-heart">Wishlist</span>
                                <span className="bi mx-4 bi-gift">Offers</span>
                                                                <span className="bi bi-person">signin</span>


                                </div>
            </header>
                )
        }
    function WeatherCard(){
        return(
            <div className ="card mt-4 bg-dark text-white w-50">
                <div className ="card-header bg-info d-flex justify-content-between">
                    <div>
                        <div className="fs-3 fw-bold">hyderabad</div>
                        <div>29-oct-2026
                        </div>
                    </div>
                    <div>
                        Live Weather</div>
                </div>
                <div className="card-body d-flex justify-content-between">
                    <div className="fs-1 fw-bold">27&deg;c
                    </div>
                        <div>
                            <span className="bi bi cloud-rain">Raining</span>
                        </div>
                </div>
                            <div className="card-footer  bg-danger">   Lorem ipsum dolor sit amet consectetur adipisicing elit. Sunt soluta quia nostrum,
                                </div>

                
                
                
            </div>
        )
    }
    const root=
    ReactDOM.createRoot(document.getElementById("root"));
        root.render(<WeatherIndex/>);
    </script>



</head>
<body>
    <noscript>Please enable js in your browser.</noscript>
    <div id="root"></div>
</body>
</html>
